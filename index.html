<div style="padding:14px 18px 12px">
<p class="serif" style="margin:0; font-style:italic; font-size:18px; line-height:1.4">${esc(x.l)}</p>
<p style="margin:10px 0 0; display:flex; align-items:center; gap:6px; font-size:14px; color:#5E4E3E"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${esc(x.v)}</p>
${dress}
<div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:1px dashed #D2BC8E">
<a href="${e.map}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; min-height:44px; font-size:14px; font-weight:500; color:#6B1F2A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>${esc(t.directions)}</a>
<div style="width:56px; height:56px; border-radius:50%; outline:1.5px solid rgba(107,31,42,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-12deg); color:rgba(107,31,42,.8); font-size:9px; letter-spacing:1px; line-height:1.25"><span>${esc(pmCity)}</span><span>${e.pm}</span></div>
</div>
</div>
</article>`;
  }).join('');
}

function renderContacts() {
  const t = T[lang];
  $('contacts').innerHTML = CONTACTS.map(([k, num]) => {
    const name = esc(t[k]), shown = '+91 ' + num.slice(0, 5) + ' ' + num.slice(5);
    return `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-top:1px dashed #D2BC8E">
<div style="min-width:0"><p style="margin:0; font-weight:500">${name}</p><p style="margin:0; font-size:14px; color:#5E4E3E">${shown}</p></div>
<div style="display:flex; gap:6px; flex:none">
<a href="tel:+91${num}" aria-label="${esc(t.call)} ${name}" style="width:44px; height:44px; border-radius:50%; border:1px solid #B08A3E; display:flex; align-items:center; justify-content:center; color:#6B1F2A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></a>
<a href="https://wa.me/91${num}" target="_blank" rel="noopener" aria-label="WhatsApp ${name}" style="width:44px; height:44px; border-radius:50%; background:#6B1F2A; display:flex; align-items:center; justify-content:center; color:#FBF7EE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1a4 4 0 0 1-2-2l1-1-1-2z"/></svg></a>
</div></div>`;
  }).join('');
}

function tick() {
  const t = T[lang], d = Math.max(0, TARGET - Date.now()), pad = (n) => String(n).padStart(2, '0');
  const parts = [[Math.floor(d / 864e5), t.days], [pad(Math.floor(d / 36e5) % 24), t.hours], [pad(Math.floor(d / 6e4) % 60), t.mins], [pad(Math.floor(d / 1e3) % 60), t.secs]];
  $('countdown').innerHTML = parts.map(([v, l]) => `<div style="display:flex; flex-direction:column; align-items:center; gap:4px"><span class="serif" style="font-size:40px; line-height:1; font-weight:600">${v}</span><span style="font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#E9CF94">${esc(l)}</span></div>`).join('');
}

function langBtn(el, on) {
  el.setAttribute('aria-pressed', on ? 'true' : 'false');
  el.style.cssText = 'min-width:44px; height:44px; padding:0 12px; border:0; font-size:14px; cursor:pointer; ' + (on ? 'background:#D9B870; color:#2B211B' : 'background:transparent; color:#FBF7EE');
}

function applyLang(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t] ?? ''; });
  document.querySelectorAll('[data-t-aria]').forEach((el) => el.setAttribute('aria-label', t[el.dataset.tAria]));
  document.querySelectorAll('[data-t-ph]').forEach((el) => el.setAttribute('placeholder', t[el.dataset.tPh]));
  langBtn($('btn-en'), l === 'en'); langBtn($('btn-hi'), l === 'hi');
  $('g-word').textContent = guests === 1 ? t.person : t.people;
  $('share').href = 'https://wa.me/?text=' + encodeURIComponent(t.shareText + ' ' + location.href.split('#')[0]);
  renderEvents(); renderContacts(); tick(); observeReveals();
  try { localStorage.setItem('sa-lang', l); } catch (e) {}
}

// Music
const audio = $('bg-music');
function setPlaying(on) { playing = on; $('ic-on').toggleAttribute('hidden', !on); $('ic-off').toggleAttribute('hidden', on); }
function play() { audio.volume = 0.6; const r = audio.play(); setPlaying(true); if (r && r.catch) r.catch(() => setPlaying(false)); }
function pause() { audio.pause(); setPlaying(false); }
$('btn-music').addEventListener('click', () => (playing ? pause() : play()));
let opened = false;
function openLetter() {
  if (opened) return; opened = true;
  if (!playing) play();
  const intro = $('intro'), reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  intro.classList.add('opening');
  setTimeout(() => {
    intro.hidden = true; $('content').hidden = false;
    window.scrollTo(0, 0); observeReveals();
    const c = $('cover'); c.setAttribute('tabindex', '-1'); c.focus({ preventScroll: true });
  }, reduce ? 0 : 750);
}
$('open-letter').addEventListener('click', openLetter);
$('envelope').addEventListener('click', openLetter);

// Reveal on scroll
const io = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: 0.12 }) : null;
function observeReveals() { document.querySelectorAll('.reveal:not(.in)').forEach((el) => (io ? io.observe(el) : el.classList.add('in'))); }

// RSVP
$('g-dec').addEventListener('click', () => { guests = Math.max(1, guests - 1); $('g-count').textContent = guests; $('g-word').textContent = guests === 1 ? T[lang].person : T[lang].people; });
$('g-inc').addEventListener('click', () => { guests = Math.min(20, guests + 1); $('g-count').textContent = guests; $('g-word').textContent = guests === 1 ? T[lang].person : T[lang].people; });
$('iv-note').addEventListener('input', (e) => { $('note-count').textContent = e.target.value.length + '/500'; });
function showError(key) { const el = $('form-error'); el.textContent = T[lang][key]; el.hidden = false; }
$('rsvp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('form-error').hidden = true;
  const name = $('iv-name').value.trim(), phone = $('iv-phone').value.trim(), note = $('iv-note').value.trim();
  if (!name) { showError('errName'); $('iv-name').focus(); return; }
  if (phone.replace(/\D/g, '').length < 10) { showError('errPhone'); $('iv-phone').focus(); return; }
  const btn = $('btn-post'); btn.disabled = true; btn.textContent = T[lang].posting;
  try {
    await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ name, phone, guests: String(guests), note, lang }) });
    $('rsvp-form').hidden = true; $('rsvp-done').hidden = false;
  } catch (err) {
    showError('errSend');
  } finally {
    btn.disabled = false; btn.textContent = T[lang].post;
  }
});
$('btn-again').addEventListener('click', () => { $('rsvp-done').hidden = true; $('rsvp-form').hidden = false; });

$('btn-en').addEventListener('click', () => applyLang('en'));
$('btn-hi').addEventListener('click', () => applyLang('hi'));
let saved = 'en'; try { saved = localStorage.getItem('sa-lang') || 'en'; } catch (e) {}
applyLang(saved === 'hi' ? 'hi' : 'en');
setInterval(tick, 1000);
}
</script>
</body>
</html>
